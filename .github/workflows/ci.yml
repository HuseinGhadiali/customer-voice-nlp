name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy scipy scikit-learn pytest ruff
      - run: ruff check .
      - name: Unit tests (pure functions; the notebooks run models and are executed locally)
        run: pytest -q
